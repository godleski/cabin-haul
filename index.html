<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabin Haul</title>
<meta property="og:title" content="Cabin Haul">
<meta property="og:description" content="Who's bringing what to the cabin.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root {
    --bg: #f2f4ee; --surface: #ffffff; --fg: #1b2a22; --muted: #5f6f66; --line: #d6dcd4;
    --pine: #2d6a4f; --pine-ink: #ffffff; --pine-soft: #e3efe8; --ember: #d2691e; --ember-soft: #fbe9db;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a15; --surface: #1b2620; --fg: #e9efe9; --muted: #9fb0a6; --line: #2f3d35;
      --pine: #6fbf95; --pine-ink: #0f1d16; --pine-soft: #1f3a2d; --ember: #f0994f; --ember-soft: #3d2a1b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45;
    padding-inline: 16px; padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(104px + env(safe-area-inset-bottom, 0px));
  }
  body.picking { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
  .wrap { max-width: 560px; margin-inline: auto; min-width: 0; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
  h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .eyebrow { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pine); font-weight: 600; }
  .lede { color: var(--muted); margin: 8px 0 0; max-width: 60ch; }
  .notice { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--ember-soft); color: var(--fg); font-size: 0.9rem; }
  .notice code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
  :is(input, select, button):focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }

  /* ---- Who are you ---- */
  .roster { display: grid; gap: 10px; margin-top: 24px; }
  .party { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; gap: 8px; align-items: center; }
  .party .amp { color: var(--muted); font-family: var(--display); font-weight: 700; flex: none; }
  .who {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font: 700 1.05rem var(--display); padding: 14px 12px; border-radius: 10px; cursor: pointer; text-align: center;
    transition: background 120ms, transform 80ms;
  }
  .who:active { transform: scale(0.97); }
  .who:hover { background: var(--pine-soft); }
  .who.solo { flex: 1; }

  /* ---- Main ---- */
  .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .topbar .me { font-size: 0.9rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .me b { color: var(--fg); }
  .linkbtn { background: none; border: 0; color: var(--pine); font: 600 0.85rem var(--body); cursor: pointer; padding: 0; text-decoration: underline; flex: none; }

  .adder { margin-top: 20px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: grid; gap: 10px; }
  .adder h2 { font-size: 1rem; font-weight: 700; }
  .adder .row { display: grid; grid-template-columns: minmax(0, 1fr) 128px; gap: 8px; }
  .adder .row2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  input[type="text"], select {
    width: 100%; font: 400 1rem var(--body); color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0;
  }
  .mode { display: flex; gap: 6px; }
  .mode button {
    flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    font: 600 0.85rem var(--body); padding: 8px 10px; border-radius: 999px; cursor: pointer;
  }
  .mode button[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--pine-ink); }
  .mode button.need[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: #fff; }
  .addbtn { border: 0; background: var(--pine); color: var(--pine-ink); font: 700 0.95rem var(--body); padding: 10px 18px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .addbtn:active { transform: scale(0.98); }

  .tabs { display: flex; gap: 4px; margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 600 0.9rem var(--body); padding: 9px 10px; border-radius: 999px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--pine); color: var(--pine-ink); }
  .tabs button .k { opacity: 0.75; font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .group { margin-top: 22px; }
  .group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--pine); padding-bottom: 6px; }
  .group-head h2 { font-size: 1.2rem; font-weight: 700; }
  .group-head .k { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .group.needed .group-head { border-color: var(--ember); }
  .list { display: grid; gap: 8px; margin-top: 10px; }
  .item {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 14px;
  }
  .item.need { border-style: dashed; border-color: var(--ember); }
  .item.mine { border-color: var(--pine); }
  .item .title { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .item .title .note { font-weight: 400; color: var(--muted); }
  .item .title .cat { font-weight: 500; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-left: 6px; }
  .item .meta { grid-column: 1; font-size: 0.82rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .item .meta .by { color: var(--pine); font-weight: 600; }
  .item .meta .nobody { color: var(--ember); font-weight: 600; }
  .item .meta .rm { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; margin-left: 6px; }
  .act {
    grid-row: 1 / span 2; grid-column: 2; align-self: center; flex: none;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font: 700 0.85rem var(--body); padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .act.claim { background: var(--ember); border-color: var(--ember); color: #fff; }
  .act.unclaim { color: var(--muted); font-weight: 600; }
  .act[disabled] { opacity: 0.6; cursor: wait; }
  .empty { margin-top: 12px; padding: 18px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 0.9rem; text-align: center; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .bar-inner { max-width: 560px; margin-inline: auto; display: flex; align-items: center; gap: 10px; }
  .bar .status { flex: 1; min-width: 0; font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .status b { color: var(--fg); font-weight: 600; }
  .bar .status .warn { color: var(--ember); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-right: 6px; vertical-align: middle; }
  .dot.live { background: var(--pine); }
  .btn { border: 0; background: var(--pine-soft); color: var(--pine); font: 700 0.88rem var(--body); padding: 10px 12px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--pine); color: var(--pine-ink); }

  .toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 0.9rem;
    opacity: 0; pointer-events: none; transition: opacity 180ms; max-width: calc(100% - 32px); text-align: center; z-index: 6;
  }
  .toast.show { opacity: 1; }
  .skeleton { margin-top: 28px; color: var(--muted); font-size: 0.92rem; }
  @media (max-width: 420px) { .adder .row { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .who, .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- Screen 1: who are you -->
  <div id="pick" hidden>
    <div class="eyebrow">Cabin trip</div>
    <h1>Who are you?</h1>
    <p class="lede">Tap your name. Couples are paired up, so whatever you add shows as coming from both of you.</p>
    <div class="roster" id="roster"></div>
  </div>

  <!-- Screen 2: who's bringing what -->
  <div id="main" hidden>
    <div class="topbar">
      <div class="me" id="me"></div>
      <button class="linkbtn" id="switch" type="button">Not you?</button>
    </div>
    <h1 style="margin-top:8px">Who's bringing what</h1>
    <p class="lede">Add what you're bringing so nobody doubles up. If something's needed and you can't grab it, flag it and someone else can claim it.</p>
    <div class="notice" id="setup" hidden></div>

    <form class="adder" id="adder">
      <div class="mode" role="group" aria-label="What kind of entry">
        <button type="button" id="mode-bring" aria-pressed="true">I'm bringing this</button>
        <button type="button" id="mode-need" class="need" aria-pressed="false">Someone should bring this</button>
      </div>
      <div class="row">
        <input type="text" id="new-name" placeholder="What is it?" maxlength="60" aria-label="Item" autocomplete="off">
        <select id="new-cat" aria-label="Category">
          <option>Food</option><option>Drinks</option><option>Booze</option><option>Snacks</option><option>Supplies</option><option>Gear</option><option>Other</option>
        </select>
      </div>
      <div class="row2">
        <input type="text" id="new-note" placeholder="Optional: how much, which kind" maxlength="80" aria-label="Note" autocomplete="off">
        <button class="addbtn" type="submit" id="addbtn">Add</button>
      </div>
    </form>

    <div class="tabs" role="tablist">
      <button role="tab" id="tab-items" aria-selected="true" type="button">By item</button>
      <button role="tab" id="tab-people" aria-selected="false" type="button">By person</button>
    </div>
    <div id="groups"><p class="skeleton">Loading the list…</p></div>
  </div>
</div>

<div class="bar" id="bar" hidden>
  <div class="bar-inner">
    <div class="status" id="status"><span class="dot" id="dot"></span><b>0 items</b></div>
    <button class="btn" id="copylink" type="button">Copy link</button>
    <button class="btn primary" id="copylist" type="button">Copy list</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var CFG = window.CABIN_CONFIG || {};
  var SUPABASE_URL = String(CFG.supabaseUrl || 'PASTE_YOUR_PROJECT_URL');
  var SUPABASE_ANON_KEY = String(CFG.supabaseAnonKey || 'PASTE_YOUR_ANON_KEY');

  // ---- Who's coming. Edit here; the first name in a pair is just display order. ----
  var PARTIES = [
    ['Joe', 'Katelyn'],
    ['Mitch', 'Jess'],
    ['Luke', 'Liv'],
    ['Kyle', 'Kelly'],
    ['Justin', 'Gabby'],
    ['Terry', 'Kyrsten'],
    ['Drew']
  ];
  var CATEGORIES = ['Food', 'Drinks', 'Booze', 'Snacks', 'Supplies', 'Gear', 'Other'];

  function partyOf(name) {
    for (var i = 0; i < PARTIES.length; i++) if (PARTIES[i].indexOf(name) >= 0) return PARTIES[i].join(' & ');
    return null;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) { return String(s).trim().replace(/\s+/g, ' ').toLowerCase(); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function $(id) { return document.getElementById(id); }

  var toastEl = $('toast'), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }
  function copyText(text, okMsg) {
    var ok = function () { toast(okMsg); };
    var no = function () { toast('Copy didn\'t work on this browser.'); };
    try { navigator.clipboard.writeText(text).then(ok, no); } catch (e) { no(); }
  }

  // ---- Identity ----
  var me = lsGet('cabin-haul-me');
  if (me && !partyOf(me)) me = null;           // roster changed; ask again
  var myParty = me ? partyOf(me) : null;

  function renderRoster() {
    $('roster').innerHTML = PARTIES.map(function (p) {
      if (p.length === 1) return '<div class="party"><button type="button" class="who solo" data-me="' + esc(p[0]) + '">' + esc(p[0]) + '</button></div>';
      return '<div class="party"><button type="button" class="who" data-me="' + esc(p[0]) + '">' + esc(p[0]) + '</button><span class="amp">&amp;</span><button type="button" class="who" data-me="' + esc(p[1]) + '">' + esc(p[1]) + '</button></div>';
    }).join('');
  }
  $('roster').addEventListener('click', function (e) {
    var b = e.target.closest('[data-me]'); if (!b) return;
    me = b.getAttribute('data-me'); myParty = partyOf(me); lsSet('cabin-haul-me', me);
    showScreen();
  });
  $('switch').addEventListener('click', function () { me = null; myParty = null; lsDel('cabin-haul-me'); showScreen(); });

  function showScreen() {
    var picking = !me;
    $('pick').hidden = !picking; $('main').hidden = picking; $('bar').hidden = picking;
    document.body.classList.toggle('picking', picking);
    if (picking) { renderRoster(); window.scrollTo(0, 0); return; }
    var partner = PARTIES.filter(function (p) { return p.indexOf(me) >= 0; })[0].filter(function (n) { return n !== me; })[0];
    $('me').innerHTML = 'Hey <b>' + esc(me) + '</b>' + (partner ? ' · with ' + esc(partner) : '');
    if (!booted) boot(); else render();
  }

  // ---- Database ----
  var sb = null, booted = false, items = [], busy = {}, live = false;
  var view = lsGet('cabin-haul-view') || 'items';
  var mode = 'bring';

  function boot() {
    booted = true;
    if (SUPABASE_URL.indexOf('PASTE_') === 0 || SUPABASE_ANON_KEY.indexOf('PASTE_') === 0 || !window.supabase) {
      $('setup').hidden = false;
      $('setup').innerHTML = window.supabase
        ? 'This copy isn\'t connected to a database yet. Copy <code>config.example.js</code> to <code>config.js</code> and paste in your Supabase URL and key. See README.md.'
        : 'The database library didn\'t load. Check your internet connection and reload.';
      $('groups').innerHTML = '';
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    try {
      sb.channel('cabin-haul')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, scheduleReload)
        .subscribe(function (status) { live = status === 'SUBSCRIBED'; updateStatus(); });
    } catch (e) { /* polling covers it */ }
    setInterval(function () { if (!document.hidden && me) load(); }, 15000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && me) load(); });
    load();
  }
  var reloadTimer;
  function scheduleReload() { clearTimeout(reloadTimer); reloadTimer = setTimeout(load, 250); }

  function load() {
    if (!sb) return Promise.resolve();
    return sb.from('items').select('id,name,note,category,party,claimed_by,added_by,adder_id,created_at').order('created_at', { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        items = res.data || [];
        render();
      }).catch(function (e) {
        $('groups').innerHTML = '<p class="skeleton">Couldn\'t load the list (' + esc(e.message || e) + '). Check config.js, and that the SQL in schema.sql was run.</p>';
      });
  }

  // ---- Render ----
  function itemRow(it, showCat) {
    var mine = it.party && it.party === myParty;
    var cls = 'item' + (!it.party ? ' need' : '') + (mine ? ' mine' : '');
    var meta, act = '';
    if (!it.party) {
      meta = '<span class="nobody">Nobody yet</span>' + (it.added_by ? ' · flagged by ' + esc(it.added_by) : '');
      act = '<button type="button" class="act claim" data-claim="' + esc(it.id) + '">I\'ll bring it</button>';
    } else {
      meta = '<span class="by">' + esc(it.party) + '</span>' + (mine ? ' (you)' : '');
      if (mine) act = '<button type="button" class="act unclaim" data-unclaim="' + esc(it.id) + '">Not bringing</button>';
    }
    var canRemove = (it.adder_id && it.adder_id === myId()) || mine;
    if (canRemove) meta += '<button type="button" class="rm" data-rm="' + esc(it.id) + '">remove</button>';
    return '<div class="' + cls + '" data-id="' + esc(it.id) + '">' +
      '<div class="title">' + esc(it.name) + (it.note ? ' <span class="note">· ' + esc(it.note) + '</span>' : '') + (showCat ? '<span class="cat">' + esc(it.category) + '</span>' : '') + '</div>' +
      act + '<div class="meta">' + meta + '</div></div>';
  }

  function render() {
    if (!me) return;
    $('tab-items').setAttribute('aria-selected', String(view === 'items'));
    $('tab-people').setAttribute('aria-selected', String(view === 'people'));
    var needed = items.filter(function (it) { return !it.party; });
    $('tab-items').innerHTML = 'By item<span class="k">' + items.length + '</span>';
    $('tab-people').innerHTML = 'By person' + (needed.length ? '<span class="k">' + needed.length + ' needed</span>' : '');
    var html = '';
    if (!items.length) {
      html = '<div class="empty">Nothing on the list yet. Add the first thing above.</div>';
    } else if (view === 'items') {
      if (needed.length) {
        html += '<section class="group needed"><div class="group-head"><h2>Still needed</h2><span class="k">' + plural(needed.length, 'item', 'items') + '</span></div><div class="list">';
        needed.forEach(function (it) { html += itemRow(it, true); });
        html += '</div></section>';
      }
      var cats = CATEGORIES.slice();
      items.forEach(function (it) { if (cats.indexOf(it.category) < 0) cats.push(it.category); });
      cats.forEach(function (cat) {
        var rows = items.filter(function (it) { return it.party && it.category === cat; });
        if (!rows.length) return;
        html += '<section class="group"><div class="group-head"><h2>' + esc(cat) + '</h2><span class="k">' + plural(rows.length, 'item', 'items') + '</span></div><div class="list">';
        rows.forEach(function (it) { html += itemRow(it, false); });
        html += '</div></section>';
      });
    } else {
      var parties = PARTIES.map(function (p) { return p.join(' & '); });
      items.forEach(function (it) { if (it.party && parties.indexOf(it.party) < 0) parties.push(it.party); });
      // You first, then everyone else in roster order.
      parties.sort(function (a, b) { return (b === myParty) - (a === myParty); });
      parties.forEach(function (party) {
        var rows = items.filter(function (it) { return it.party === party; });
        html += '<section class="group"><div class="group-head"><h2>' + esc(party) + (party === myParty ? ' <span class="k">(you)</span>' : '') + '</h2><span class="k">' + plural(rows.length, 'item', 'items') + '</span></div>';
        if (rows.length) { html += '<div class="list">'; rows.forEach(function (it) { html += itemRow(it, true); }); html += '</div>'; }
        else html += '<div class="empty">Nothing yet</div>';
        html += '</section>';
      });
      if (needed.length) {
        html += '<section class="group needed"><div class="group-head"><h2>Still needed</h2><span class="k">' + plural(needed.length, 'item', 'items') + '</span></div><div class="list">';
        needed.forEach(function (it) { html += itemRow(it, true); });
        html += '</div></section>';
      }
    }
    $('groups').innerHTML = html;
    updateStatus();
  }

  function updateStatus() {
    var needed = items.filter(function (it) { return !it.party; }).length;
    var mine = items.filter(function (it) { return it.party === myParty; }).length;
    var s = '<span class="dot' + (live ? ' live' : '') + '" id="dot"></span><b>' + plural(items.length, 'item', 'items') + '</b>';
    if (myParty) s += ' · you\'ve got ' + mine;
    if (needed) s += ' · <span class="warn">' + needed + ' still needed</span>';
    $('status').innerHTML = s;
  }

  // ---- Actions ----
  function myId() {
    var id = lsGet('cabin-haul-voter-id');
    if (!id) {
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2);
      lsSet('cabin-haul-voter-id', id);
    }
    return id;
  }

  function setBusy(id, on) {
    busy[id] = on;
    var el = document.querySelector('.item[data-id="' + id + '"] .act');
    if (el) el.disabled = on;
  }

  function addItem() {
    var nameEl = $('new-name'), noteEl = $('new-note'), catEl = $('new-cat');
    var name = nameEl.value.replace(/\s+/g, ' ').trim();
    var note = noteEl.value.replace(/\s+/g, ' ').trim();
    if (!name) { nameEl.focus(); return; }
    var dup = items.filter(function (it) { return norm(it.name) === norm(name); })[0];
    if (dup) {
      if (!dup.party && mode === 'bring') { toast('"' + dup.name + '" was already needed. It\'s yours now.'); claim(dup.id); }
      else if (dup.party) toast('"' + dup.name + '" is already covered by ' + dup.party + '.');
      else toast('"' + dup.name + '" is already on the needed list.');
      nameEl.value = ''; noteEl.value = '';
      return;
    }
    var row = { name: name, note: note || null, category: catEl.value, added_by: me, adder_id: myId(),
      party: mode === 'bring' ? myParty : null, claimed_by: mode === 'bring' ? me : null };
    $('addbtn').disabled = true;
    sb.from('items').insert(row).select().single()
      .then(function (res) {
        if (res.error) throw res.error;
        items.push(res.data);
        nameEl.value = ''; noteEl.value = '';
        render();
        nameEl.focus();
      }).catch(function (e) {
        if (e && e.code === '23505') { nameEl.value = ''; load().then(function () { toast('Someone just added that one.'); }); }
        else toast('Couldn\'t add that: ' + (e.message || e));
      }).then(function () { $('addbtn').disabled = false; });
  }

  function claim(id) {
    if (busy[id]) return;
    setBusy(id, true);
    sb.from('items').update({ party: myParty, claimed_by: me }).eq('id', id).select().single()
      .then(function (res) {
        if (res.error) throw res.error;
        items = items.map(function (it) { return it.id === id ? res.data : it; });
        render();
      }).catch(function (e) { toast('Couldn\'t claim that: ' + (e.message || e)); })
      .then(function () { setBusy(id, false); });
  }

  function unclaim(id) {
    if (busy[id]) return;
    setBusy(id, true);
    sb.from('items').update({ party: null, claimed_by: null }).eq('id', id).select().single()
      .then(function (res) {
        if (res.error) throw res.error;
        items = items.map(function (it) { return it.id === id ? res.data : it; });
        render();
        toast('Moved to "Still needed" so someone else can grab it.');
      }).catch(function (e) { toast('Couldn\'t update that: ' + (e.message || e)); })
      .then(function () { setBusy(id, false); });
  }

  function removeItem(id) {
    var it = items.filter(function (x) { return x.id === id; })[0];
    if (!it) return;
    sb.from('items').delete().eq('id', id).then(function (res) {
      if (res.error) throw res.error;
      items = items.filter(function (x) { return x.id !== id; });
      render();
      toast('Removed "' + it.name + '".');
    }).catch(function (e) { toast('Couldn\'t remove that: ' + (e.message || e)); });
  }

  $('adder').addEventListener('submit', function (e) { e.preventDefault(); addItem(); });
  $('mode-bring').addEventListener('click', function () { mode = 'bring'; syncMode(); });
  $('mode-need').addEventListener('click', function () { mode = 'need'; syncMode(); });
  function syncMode() {
    $('mode-bring').setAttribute('aria-pressed', String(mode === 'bring'));
    $('mode-need').setAttribute('aria-pressed', String(mode === 'need'));
    $('addbtn').textContent = mode === 'bring' ? 'Add' : 'Flag it';
    $('new-name').placeholder = mode === 'bring' ? 'What are you bringing?' : 'What do we still need?';
  }
  $('groups').addEventListener('click', function (e) {
    var c = e.target.closest('[data-claim]'); if (c) { claim(c.getAttribute('data-claim')); return; }
    var u = e.target.closest('[data-unclaim]'); if (u) { unclaim(u.getAttribute('data-unclaim')); return; }
    var r = e.target.closest('[data-rm]'); if (r) removeItem(r.getAttribute('data-rm'));
  });
  $('tab-items').addEventListener('click', function () { view = 'items'; lsSet('cabin-haul-view', view); render(); });
  $('tab-people').addEventListener('click', function () { view = 'people'; lsSet('cabin-haul-view', view); render(); });
  $('copylink').addEventListener('click', function () { copyText(location.href.split('#')[0], 'Link copied. Paste it into the group chat.'); });

  function listText() {
    var lines = ['Cabin haul · ' + new Date().toLocaleDateString()];
    var needed = items.filter(function (it) { return !it.party; });
    if (needed.length) {
      lines.push('', 'STILL NEEDED');
      needed.forEach(function (it) { lines.push('☐ ' + it.name + (it.note ? ' (' + it.note + ')' : '') + ' · ' + it.category); });
    }
    PARTIES.map(function (p) { return p.join(' & '); }).forEach(function (party) {
      var rows = items.filter(function (it) { return it.party === party; });
      if (!rows.length) return;
      lines.push('', party.toUpperCase());
      rows.forEach(function (it) { lines.push('• ' + it.name + (it.note ? ' (' + it.note + ')' : '') + ' · ' + it.category); });
    });
    return lines.join('\n');
  }
  $('copylist').addEventListener('click', function () {
    if (!items.length) { toast('Nothing to copy yet.'); return; }
    copyText(listText(), 'List copied: who\'s bringing what, plus what\'s still needed.');
  });

  syncMode();
  showScreen();
})();
</script>
</body>
</html>
